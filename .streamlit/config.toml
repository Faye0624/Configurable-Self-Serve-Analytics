# Streamlit settings applied both locally and when deployed.

[server]
# Uploaded files are small CSVs; keep the cap low so a stray large file can't
# exhaust a small hosted instance.
maxUploadSize = 25

[browser]
gatherUsageStats = false

# Charcoal and warm sand: a dark, low-contrast base with a single warm accent,
# so charts and data stay the brightest things on the page.
[theme]
base = "dark"
backgroundColor = "#171614"          # page
secondaryBackgroundColor = "#1E1C19"  # cards, sidebar, inputs
primaryColor = "#D9C7A3"             # sand — buttons, focus, selection
textColor = "#F5F2EC"
